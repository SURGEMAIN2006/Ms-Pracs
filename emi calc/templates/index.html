<!DOCTYPE html>
<html>
<head>
    <title>EMI Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin-top: 60px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>EMI Calculator</h1>

    <form method="POST">

        <input type="number" name="principal"
        placeholder="Loan Amount" required>

        <input type="number" step="0.01" name="rate"
        placeholder="Annual Interest Rate (%)" required>

        <input type="number" name="time"
        placeholder="Loan Period (Years)" required>

        <button type="submit">Calculate EMI</button>

    </form>

    {% if emi %}
        <h2>Monthly EMI = ₹ {{ emi }}</h2>
    {% endif %}

</div>

</body>
</html>
