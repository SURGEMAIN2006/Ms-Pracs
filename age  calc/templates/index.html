<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin-top: 80px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        h2 {
            color: green;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Age Calculator</h1>

    <form method="POST">

        <label><b>Select Date of Birth</b></label>

        <br><br>

        <input type="date" name="dob" required>

        <br>

        <button type="submit">Calculate Age</button>

    </form>

    {% if age is not none %}
        <h2>Your Age is {{ age }} Years</h2>
    {% endif %}

</div>

</body>
</html>
